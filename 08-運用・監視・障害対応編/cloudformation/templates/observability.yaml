AWSTemplateFormatVersion: '2010-09-09'
Description: 'Module 08 - Basic Observability Platform'

Parameters:
  ApplicationName:
    Type: String
    Default: ops-monitoring-platform
    Description: Name of the application being monitored

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  AlertEmail:
    Type: String
    Description: Email address for critical alerts

Resources:
  # SNS Topic for Alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ApplicationName}-${Environment}-alerts'
      DisplayName: 'System Alerts'

  # SNS Email Subscription
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # CloudWatch Log Group
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/applications/${ApplicationName}/${Environment}'
      RetentionInDays: 30

  # Simple CloudWatch Alarm
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApplicationName}-${Environment}-HighErrorRate'
      AlarmDescription: 'High error rate detected'
      MetricName: 'Errors'
      Namespace: 'AWS/Logs'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

Outputs:
  AlertsTopicArn:
    Description: SNS Topic ARN for alerts
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlertsTopic'

  LogGroupName:
    Description: Application log group name
    Value: !Ref ApplicationLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup'

  ObservabilityStatus:
    Description: 'Observability platform status'
    Value: 'Basic monitoring infrastructure deployed successfully'