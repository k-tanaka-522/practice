AWSTemplateFormatVersion: '2010-09-09'
Description: 'Module 08 - Operations Monitoring and Incident Response Platform - Main Stack'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: 'デプロイ環境'
  
  S3BucketName:
    Type: String
    Description: 'CloudFormationテンプレート格納用S3バケット名'
    
  ProjectName:
    Type: String
    Default: ops-monitoring-platform
    Description: 'プロジェクト名（リソース命名用）'

Resources:
  ObservabilityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3BucketName}.s3.amazonaws.com/templates/observability.yaml'
      Parameters:
        Environment: !Ref Environment
        ApplicationName: !Ref ProjectName
        AlertEmail: admin@example.com

Outputs:
  StackStatus:
    Description: 'スタック状態'
    Value: 'Created'
