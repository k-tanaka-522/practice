AWSTemplateFormatVersion: '2010-09-09'
Description: 'Comprehensive Cost Optimization and FinOps Implementation'

Parameters:
  ApplicationName:
    Type: String
    Default: my-web-app
    Description: Name of the application

  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Environment name

  MonthlyBudget:
    Type: Number
    Default: 500
    Description: Monthly budget limit in USD

  AlertEmail:
    Type: String
    Description: Email address for cost alerts

  ForecastThreshold:
    Type: Number
    Default: 80
    Description: Budget percentage threshold for forecast alerts

  SpendThreshold:
    Type: Number
    Default: 90
    Description: Budget percentage threshold for actual spend alerts

Resources:
  # S3 Bucket for Cost Reports
  CostReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ApplicationName}-${Environment}-cost-reports-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt CostAnalysisLambda.Arn
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Sub '${ApplicationName}-${Environment}'

  # Cost and Usage Reports
  CostAndUsageReport:
    Type: AWS::CUR::ReportDefinition
    Properties:
      ReportName: !Sub '${ApplicationName}-${Environment}-cost-usage-report'
      TimeUnit: DAILY
      Format: textORcsv
      Compression: GZIP
      AdditionalSchemaElements:
        - RESOURCES
      S3Bucket: !Ref CostReportsBucket
      S3Prefix: 'cost-reports'
      S3Region: !Ref AWS::Region
      AdditionalArtifacts:
        - REDSHIFT
        - QUICKSIGHT
      RefreshClosedReports: true
      ReportVersioning: OVERWRITE_REPORT

  # Budget with Multiple Alert Thresholds
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ApplicationName}-${Environment}-monthly-budget'
        BudgetLimit:
          Amount: !Ref MonthlyBudget
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          TagKey:
            - CostCenter
          TagValue:
            - !Sub '${ApplicationName}-${Environment}'
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref SpendThreshold
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
            - SubscriptionType: SNS
              Address: !Ref CostAlertsTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref ForecastThreshold
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
            - SubscriptionType: SNS
              Address: !Ref CostAlertsTopic

  # Service-specific Budgets
  EC2Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ApplicationName}-${Environment}-ec2-budget'
        BudgetLimit:
          Amount: !Ref MonthlyBudget
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          Service:
            - Amazon Elastic Compute Cloud - Compute
          TagKey:
            - Application
          TagValue:
            - !Ref ApplicationName
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertsTopic

  RDSBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ApplicationName}-${Environment}-rds-budget'
        BudgetLimit:
          Amount: !Ref MonthlyBudget
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          Service:
            - Amazon Relational Database Service
          TagKey:
            - Application
          TagValue:
            - !Ref ApplicationName
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertsTopic

  # SNS Topic for Cost Alerts
  CostAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ApplicationName}-${Environment}-cost-alerts'
      DisplayName: 'Cost Optimization Alerts'

  CostAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CostAlertsTopic
      Protocol: lambda
      Endpoint: !GetAtt CostAnalysisLambda.Arn

  # Lambda for Cost Analysis and Actions
  CostAnalysisLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ApplicationName}-cost-analysis'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt CostAnalysisRole.Arn
      Timeout: 300
      MemorySize: 512
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          from datetime import datetime, timedelta
          import urllib.request
          
          def lambda_handler(event, context):
              try:
                  # Handle different event sources
                  if 'Records' in event:
                      # SNS event from budget alerts
                      for record in event['Records']:
                          if record['EventSource'] == 'aws:sns':
                              handle_budget_alert(record['Sns'])
                          elif record['EventSource'] == 'aws:s3':
                              handle_cost_report(record['s3'])
                  else:
                      # Scheduled event for regular analysis
                      perform_cost_analysis()
                  
                  return {'statusCode': 200, 'body': 'Cost analysis completed'}
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {'statusCode': 500, 'body': str(e)}
          
          def handle_budget_alert(sns_message):
              """Handle budget alert notifications"""
              message = json.loads(sns_message['Message'])
              
              # Extract budget information
              budget_name = message.get('budgetName', 'Unknown')
              alert_type = message.get('alertType', 'Unknown')
              actual_amount = message.get('actualAmount', 0)
              budgeted_amount = message.get('budgetedAmount', 0)
              
              # Calculate percentage
              percentage = (actual_amount / budgeted_amount * 100) if budgeted_amount > 0 else 0
              
              # Send enhanced notification
              send_cost_notification(
                  f"Budget Alert: {budget_name}",
                  f"Alert Type: {alert_type}\n"
                  f"Actual: ${actual_amount:.2f}\n"
                  f"Budget: ${budgeted_amount:.2f}\n"
                  f"Percentage: {percentage:.1f}%",
                  'warning' if percentage < 90 else 'danger'
              )
              
              # Take automated actions if over threshold
              if percentage > 90:
                  take_cost_reduction_actions()
          
          def handle_cost_report(s3_event):
              """Process new cost and usage reports"""
              bucket = s3_event['bucket']['name']
              key = s3_event['object']['key']
              
              # Download and analyze the report
              s3 = boto3.client('s3')
              
              try:
                  # Get object and analyze costs
                  response = s3.get_object(Bucket=bucket, Key=key)
                  # Process CSV content (simplified)
                  
                  # Generate insights and recommendations
                  generate_cost_insights(bucket, key)
                  
              except Exception as e:
                  print(f"Error processing cost report: {e}")
          
          def perform_cost_analysis():
              """Perform regular cost analysis"""
              ce = boto3.client('ce')
              
              # Get cost data for last 30 days
              end_date = datetime.now().strftime('%Y-%m-%d')
              start_date = (datetime.now() - timedelta(days=30)).strftime('%Y-%m-%d')
              
              # Get costs by service
              response = ce.get_cost_and_usage(
                  TimePeriod={'Start': start_date, 'End': end_date},
                  Granularity='DAILY',
                  Metrics=['BlendedCost'],
                  GroupBy=[{'Type': 'DIMENSION', 'Key': 'SERVICE'}]
              )
              
              # Analyze trends and anomalies
              analyze_cost_trends(response)
              
              # Generate recommendations
              generate_recommendations()
          
          def take_cost_reduction_actions():
              """Automated cost reduction actions"""
              ec2 = boto3.client('ec2')
              ecs = boto3.client('ecs')
              rds = boto3.client('rds')
              
              environment = os.environ.get('ENVIRONMENT', 'production')
              
              # Only take automated actions in non-production environments
              if environment != 'production':
                  # Stop development instances during off-hours
                  if is_off_hours():
                      stop_development_resources()
                  
                  # Scale down ECS services
                  scale_down_ecs_services()
              
              # Send notification about actions taken
              send_cost_notification(
                  "Automated Cost Reduction",
                  "Cost reduction actions have been triggered due to budget threshold breach.",
                  'info'
              )
          
          def stop_development_resources():
              """Stop development resources during off-hours"""
              ec2 = boto3.client('ec2')
              rds = boto3.client('rds')
              
              app_name = os.environ.get('APPLICATION_NAME', 'my-web-app')
              
              # Stop EC2 instances tagged as development
              instances = ec2.describe_instances(
                  Filters=[
                      {'Name': 'tag:Environment', 'Values': ['development']},
                      {'Name': 'tag:Application', 'Values': [app_name]},
                      {'Name': 'instance-state-name', 'Values': ['running']}
                  ]
              )
              
              for reservation in instances['Reservations']:
                  for instance in reservation['Instances']:
                      instance_id = instance['InstanceId']
                      print(f"Stopping instance: {instance_id}")
                      ec2.stop_instances(InstanceIds=[instance_id])
              
              # Stop RDS instances tagged as development
              try:
                  rds_instances = rds.describe_db_instances()
                  for db in rds_instances['DBInstances']:
                      if db['DBInstanceStatus'] == 'available':
                          # Check tags
                          tags = rds.list_tags_for_resource(
                              ResourceName=db['DBInstanceArn']
                          )['TagList']
                          
                          env_tag = next((tag for tag in tags if tag['Key'] == 'Environment'), None)
                          app_tag = next((tag for tag in tags if tag['Key'] == 'Application'), None)
                          
                          if (env_tag and env_tag['Value'] == 'development' and
                              app_tag and app_tag['Value'] == app_name):
                              print(f"Stopping RDS instance: {db['DBInstanceIdentifier']}")
                              rds.stop_db_instance(
                                  DBInstanceIdentifier=db['DBInstanceIdentifier']
                              )
              except Exception as e:
                  print(f"Error stopping RDS instances: {e}")
          
          def scale_down_ecs_services():
              """Scale down ECS services to minimum capacity"""
              ecs = boto3.client('ecs')
              
              app_name = os.environ.get('APPLICATION_NAME', 'my-web-app')
              
              # List clusters
              clusters = ecs.list_clusters()
              
              for cluster_arn in clusters['clusterArns']:
                  if 'dev' in cluster_arn or 'development' in cluster_arn:
                      # List services in cluster
                      services = ecs.list_services(cluster=cluster_arn)
                      
                      for service_arn in services['serviceArns']:
                          if app_name in service_arn:
                              # Scale down to 1 task
                              ecs.update_service(
                                  cluster=cluster_arn,
                                  service=service_arn,
                                  desiredCount=1
                              )
                              print(f"Scaled down service: {service_arn}")
          
          def is_off_hours():
              """Check if current time is off-hours"""
              from datetime import datetime
              import pytz
              
              # Tokyo timezone
              jst = pytz.timezone('Asia/Tokyo')
              now = datetime.now(jst)
              
              # Off-hours: before 8 AM or after 7 PM, or weekends
              if now.hour < 8 or now.hour >= 19 or now.weekday() >= 5:
                  return True
              return False
          
          def analyze_cost_trends(cost_data):
              """Analyze cost trends and detect anomalies"""
              cloudwatch = boto3.client('cloudwatch')
              
              # Calculate daily costs and send to CloudWatch
              for result in cost_data['ResultsByTime']:
                  date = result['TimePeriod']['Start']
                  total_cost = 0
                  
                  for group in result['Groups']:
                      service = group['Keys'][0]
                      cost = float(group['Metrics']['BlendedCost']['Amount'])
                      total_cost += cost
                      
                      # Send service-level metrics
                      cloudwatch.put_metric_data(
                          Namespace='CostOptimization',
                          MetricData=[{
                              'MetricName': 'DailyCost',
                              'Value': cost,
                              'Unit': 'None',
                              'Dimensions': [
                                  {'Name': 'Service', 'Value': service},
                                  {'Name': 'Application', 'Value': os.environ.get('APPLICATION_NAME', 'my-web-app')}
                              ]
                          }]
                      )
                  
                  # Send total daily cost
                  cloudwatch.put_metric_data(
                      Namespace='CostOptimization',
                      MetricData=[{
                          'MetricName': 'TotalDailyCost',
                          'Value': total_cost,
                          'Unit': 'None',
                          'Dimensions': [
                              {'Name': 'Application', 'Value': os.environ.get('APPLICATION_NAME', 'my-web-app')}
                          ]
                      }]
                  )
          
          def generate_recommendations():
              """Generate cost optimization recommendations"""
              ec2 = boto3.client('ec2')
              compute_optimizer = boto3.client('compute-optimizer')
              
              recommendations = []
              
              try:
                  # Get EC2 recommendations
                  ec2_recommendations = compute_optimizer.get_ec2_instance_recommendations()
                  
                  for rec in ec2_recommendations['instanceRecommendations']:
                      if rec['finding'] == 'Underprovisioned':
                          recommendations.append(
                              f"Instance {rec['instanceArn']} is underprovisioned. "
                              f"Consider upgrading to {rec['recommendationOptions'][0]['instanceType']}"
                          )
                      elif rec['finding'] == 'Overprovisioned':
                          recommendations.append(
                              f"Instance {rec['instanceArn']} is overprovisioned. "
                              f"Consider downgrading to {rec['recommendationOptions'][0]['instanceType']}"
                          )
              except Exception as e:
                  print(f"Error getting compute recommendations: {e}")
              
              # Send recommendations notification
              if recommendations:
                  send_cost_notification(
                      "Cost Optimization Recommendations",
                      "\n".join(recommendations[:5]),  # Limit to top 5
                      'info'
                  )
          
          def generate_cost_insights(bucket, key):
              """Generate insights from cost reports"""
              # This would analyze the detailed cost report
              # and generate actionable insights
              pass
          
          def send_cost_notification(title, message, level='info'):
              """Send cost-related notifications"""
              sns = boto3.client('sns')
              
              # Send to Slack if webhook is configured
              slack_webhook = os.environ.get('SLACK_WEBHOOK_URL')
              if slack_webhook:
                  send_slack_notification(slack_webhook, title, message, level)
              
              # Send email notification
              try:
                  sns.publish(
                      TopicArn=os.environ.get('COST_ALERTS_TOPIC'),
                      Subject=title,
                      Message=message
                  )
              except Exception as e:
                  print(f"Error sending notification: {e}")
          
          def send_slack_notification(webhook_url, title, message, level):
              """Send notification to Slack"""
              color_map = {
                  'info': '#36a64f',
                  'warning': '#ff9800',
                  'danger': '#f44336'
              }
              
              payload = {
                  'attachments': [{
                      'color': color_map.get(level, '#36a64f'),
                      'title': title,
                      'text': message,
                      'ts': int(datetime.now().timestamp())
                  }]
              }
              
              req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'}
              )
              
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print(f"Error sending Slack notification: {e}")
      Environment:
        Variables:
          APPLICATION_NAME: !Ref ApplicationName
          ENVIRONMENT: !Ref Environment
          COST_ALERTS_TOPIC: !Ref CostAlertsTopic
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl

  CostAnalysisRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CostAnalysisPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetUsageReport
                  - ce:GetCostCategories
                  - ce:GetReservationCoverage
                  - ce:GetReservationPurchaseRecommendation
                  - ce:GetReservationUtilization
                  - ce:GetSavingsPlansUtilization
                  - ce:GetSavingsPlansUtilizationDetails
                  - budgets:ViewBudget
                  - budgets:DescribeBudgets
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - rds:DescribeDBInstances
                  - rds:StopDBInstance
                  - rds:StartDBInstance
                  - rds:ListTagsForResource
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'
              - Effect: Allow
                Action:
                  - compute-optimizer:GetEC2InstanceRecommendations
                  - compute-optimizer:GetEBSVolumeRecommendations
                  - compute-optimizer:GetLambdaFunctionRecommendations
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref CostAlertsTopic
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${CostReportsBucket}/*'

  # Permission for S3 to invoke Lambda
  CostAnalysisS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CostAnalysisLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub '${CostReportsBucket}/*'

  # Permission for SNS to invoke Lambda
  CostAnalysisSNSPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CostAnalysisLambda
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref CostAlertsTopic

  # Schedule for regular cost analysis
  CostAnalysisSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: 'Daily cost analysis schedule'
      ScheduleExpression: 'cron(0 9 * * ? *)'  # 9 AM JST daily
      State: ENABLED
      Targets:
        - Arn: !GetAtt CostAnalysisLambda.Arn
          Id: CostAnalysisTarget

  CostAnalysisSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CostAnalysisLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CostAnalysisSchedule.Arn

  # CloudWatch Dashboard for Cost Monitoring
  CostDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ApplicationName}-${Environment}-cost-monitoring'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["CostOptimization", "TotalDailyCost", "Application", "${ApplicationName}"]
                ],
                "period": 86400,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "Daily Cost Trend"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["CostOptimization", "DailyCost", "Service", "Amazon Elastic Compute Cloud - Compute", "Application", "${ApplicationName}"],
                  [".", ".", ".", "Amazon Relational Database Service", ".", "."],
                  [".", ".", ".", "Amazon Simple Storage Service", ".", "."],
                  [".", ".", ".", "Amazon Elastic Load Balancing", ".", "."]
                ],
                "period": 86400,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "Cost by Service"
              }
            }
          ]
        }

  # Resource Scheduler for Development Environment
  ResourceSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ResourceSchedulerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - rds:DescribeDBInstances
                  - rds:StopDBInstance
                  - rds:StartDBInstance
                  - rds:ListTagsForResource
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'

  # Additional parameters (assuming these are passed from external)
  SlackWebhookUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ApplicationName}/${Environment}/slack-webhook-url'
      Type: String
      Value: ''
      Description: 'Slack webhook URL for cost notifications'

Outputs:
  MonthlyBudgetName:
    Description: Monthly Budget Name
    Value: !Ref MonthlyBudget

  CostReportsBucketName:
    Description: S3 Bucket for Cost Reports
    Value: !Ref CostReportsBucket

  CostDashboardURL:
    Description: CloudWatch Cost Dashboard URL
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ApplicationName}-${Environment}-cost-monitoring'

  CostAnalysisLambdaName:
    Description: Cost Analysis Lambda Function Name
    Value: !Ref CostAnalysisLambda

  CostAlertsTopicArn:
    Description: SNS Topic ARN for Cost Alerts
    Value: !Ref CostAlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-CostAlertsTopic'