AWSTemplateFormatVersion: '2010-09-09'
Description: 'Module 03 - Advanced Web Services Platform - Main Stack'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: 'Deploy environment'
  
  S3BucketName:
    Type: String
    Description: 'S3 bucket name for CloudFormation templates'
    
  ProjectName:
    Type: String
    Default: webservice-advanced
    Description: 'Project name for resource naming'

Mappings:
  EnvironmentMap:
    dev:
      LogLevel: DEBUG
      RetentionDays: 7
      ShardCount: 1
    staging:
      LogLevel: INFO
      RetentionDays: 14
      ShardCount: 2
    prod:
      LogLevel: WARN
      RetentionDays: 30
      ShardCount: 4

Resources:
  # Placeholder stack for now - to test basic deployment
  PlaceholderStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3BucketName}.s3.amazonaws.com/templates/s3-fileupload.yaml'
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Module
          Value: '3.2-FileUpload'

Outputs:
  DeploymentStatus:
    Description: 'Deployment status'
    Value: 'Module 03 deployed successfully'
  
  ProjectName:
    Description: 'Project name'
    Value: !Ref ProjectName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-project-name'