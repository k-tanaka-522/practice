AWSTemplateFormatVersion: '2010-09-09'
Description: '2.3 認証システム - Cognito User Pool + API Gateway 統合'

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: 'デプロイ環境'
    
  ProjectName:
    Type: String
    Default: webservice-basics
    Description: 'プロジェクト名'
    
  PasswordMinLength:
    Type: Number
    Default: 8
    MinValue: 6
    MaxValue: 128
    Description: '最小パスワード長'

  ApiGatewayId:
    Type: String
    Description: 'API Gateway ID（既存のAPI Gatewayに認証を追加）'

  ApiGatewayRootResourceId:
    Type: String
    Description: 'API Gateway ルートリソース ID'

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Environment}-user-pool'
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: false
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: !Ref PasswordMinLength
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      EmailVerificationMessage: 'あなたの認証コードは {####} です。'
      EmailVerificationSubject: 'メールアドレスを認証してください'
      SmsVerificationMessage: 'あなたの認証コードは {####} です。'
      UserPoolTags:
        Environment: !Ref Environment
        Project: !Ref ProjectName
        Module: '2.3-Authentication'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageAction: EMAIL
        TemporaryPasswordValidityDays: 7
        UnusedAccountValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: false
        DeviceOnlyRememberedOnUserPrompt: true

  # User Pool Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${Environment}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000
        - https://localhost:3000
        - http://localhost:3000/callback
        - https://localhost:3000/callback
      LogoutURLs:
        - http://localhost:3000
        - https://localhost:3000
        - http://localhost:3000/logout
        - https://localhost:3000/logout
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      AllowedOAuthFlowsUserPoolClient: true
      RefreshTokenValidityUnits:
        RefreshToken: days
      AccessTokenValidityUnits:
        AccessToken: hours
      IdTokenValidityUnits:
        IdToken: hours
      RefreshTokenValidity: 30
      AccessTokenValidity: 1
      IdTokenValidity: 1
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - name
        - family_name
        - given_name
        - email_verified
      WriteAttributes:
        - email
        - name
        - family_name
        - given_name

  # User Pool Domain
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  # Cognito Authorizer for API Gateway
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-cognito-authorizer'
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref ApiGatewayId
      ProviderARNs:
        - !GetAtt UserPool.Arn

  # 認証が必要なAPI用のリソース追加
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref ApiGatewayRootResourceId
      PathPart: auth

  ProfileResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref AuthResource
      PathPart: profile

  # Lambda関数: ユーザープロフィール取得
  ProfileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-profile'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt ProfileLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          USER_POOL_ID: !Ref UserPool
      Code:
        ZipFile: |
          exports.handler = async (event) => {
              console.log('Event:', JSON.stringify(event, null, 2));
              
              try {
                  // Cognito認証から取得したユーザー情報
                  const claims = event.requestContext.authorizer.claims;
                  
                  if (!claims) {
                      return {
                          statusCode: 401,
                          headers: {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*'
                          },
                          body: JSON.stringify({
                              error: 'Unauthorized',
                              message: 'Valid authentication required'
                          })
                      };
                  }
                  
                  const userProfile = {
                      userId: claims.sub,
                      username: claims['cognito:username'],
                      email: claims.email,
                      emailVerified: claims.email_verified === 'true',
                      name: claims.name || null,
                      familyName: claims.family_name || null,
                      givenName: claims.given_name || null,
                      lastLogin: new Date().toISOString(),
                      environment: process.env.ENVIRONMENT
                  };
                  
                  return {
                      statusCode: 200,
                      headers: {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      body: JSON.stringify({
                          success: true,
                          profile: userProfile
                      })
                  };
                  
              } catch (error) {
                  console.error('Profile fetch error:', error);
                  
                  return {
                      statusCode: 500,
                      headers: {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      body: JSON.stringify({
                          error: 'Internal server error',
                          message: 'Unable to fetch user profile'
                      })
                  };
              }
          };
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Module
          Value: '2.3-Authentication'

  # Lambda実行ロール（プロフィール用）
  ProfileLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-profile-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:GetUser
                Resource: !GetAtt UserPool.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # プロフィール取得API（認証必須）
  ProfileGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref ProfileResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProfileFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 401
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # プロフィール OPTIONS Method (CORS)
  ProfileOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref ProfileResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false

  # Lambda Permission
  ProfileLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProfileFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/*'

  # CloudWatch Log Group
  ProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProfileFunction}'
      RetentionInDays: 7
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  # Cognito情報
  UserPoolId:
    Description: 'Cognito User Pool ID'
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'
    
  UserPoolClientId:
    Description: 'Cognito User Pool Client ID'
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'
    
  UserPoolArn:
    Description: 'Cognito User Pool ARN'
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'
    
  UserPoolDomain:
    Description: 'Cognito User Pool Domain'
    Value: !Ref UserPoolDomain
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolDomain'
    
  UserPoolProviderName:
    Description: 'Cognito User Pool Provider Name'
    Value: !GetAtt UserPool.ProviderName
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolProviderName'
    
  UserPoolProviderURL:
    Description: 'Cognito User Pool Provider URL'
    Value: !GetAtt UserPool.ProviderURL
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolProviderURL'

  # API Gateway認証情報
  CognitoAuthorizerId:
    Description: 'Cognito Authorizer ID'
    Value: !Ref CognitoAuthorizer
    Export:
      Name: !Sub '${AWS::StackName}-CognitoAuthorizerId'

  # Lambda関数情報
  ProfileFunctionArn:
    Description: 'Profile Lambda Function ARN'
    Value: !GetAtt ProfileFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ProfileFunctionArn'

  # 設定情報
  HostedUIURL:
    Description: 'Cognito Hosted UI URL'
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=http://localhost:3000'

  AuthConfig:
    Description: '認証設定情報（フロントエンド用）'
    Value: !Sub |
      {
        "region": "${AWS::Region}",
        "userPoolId": "${UserPool}",
        "userPoolClientId": "${UserPoolClient}",
        "userPoolDomain": "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com",
        "authUrl": "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com",
        "scopes": ["email", "openid", "profile"],
        "redirectSignIn": "http://localhost:3000",
        "redirectSignOut": "http://localhost:3000",
        "responseType": "code"
      }