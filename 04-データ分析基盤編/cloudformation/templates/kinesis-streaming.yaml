AWSTemplateFormatVersion: '2010-09-09'
Description: 'Module 04 - Simple Kinesis Data Streaming Platform'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  ProjectName:
    Type: String
    Default: data-platform
    Description: Project name for resource naming

Resources:
  # Simple Kinesis Data Stream
  DataStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-data-stream'
      ShardCount: 1
      RetentionPeriodHours: 24
      StreamModeDetails:
        StreamMode: PROVISIONED
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  # Simple S3 Bucket for Raw Data (auto-generated name)
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  StreamName:
    Description: Kinesis Stream Name
    Value: !Ref DataStream
    Export:
      Name: !Sub '${AWS::StackName}-StreamName'

  StreamArn:
    Description: Kinesis Stream ARN
    Value: !GetAtt DataStream.Arn
    Export:
      Name: !Sub '${AWS::StackName}-StreamArn'

  RawDataBucketName:
    Description: Raw Data S3 Bucket Name
    Value: !Ref RawDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-RawDataBucket'